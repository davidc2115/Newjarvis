plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.assistant'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "5.0"

        ndk {
            // 32 bits (armeabi-v7a) retiré : llama.cpp utilise des instructions
            // NEON fp16 (vld1q_f16) qui n'existent que sur 64 bits. Les téléphones
            // modernes (2019+) sont quasiment tous en 64 bits de toute façon.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "jarvispass123"
            keyAlias "jarvisdebugkey"
            keyPassword "jarvispass123"
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug   { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }

    packaging {
        resources {
            pickFirsts += ['**/libc++_shared.so', '**/libllama.so', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md']
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // ── Module natif isolé : génération d'image Stable Diffusion embarquée ─────
    implementation project(':sdcpp')

    // ── Core Android ──────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // ── Réseau ────────────────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.json:json:20240303'

    // ── Accès SMB/CIFS générique (voir SmbController) — partage réseau (NAS, PC
    // Windows, disque dur Freebox une fois son partage SMB activé côté Freebox OS).
    // Bibliothèque Java pure, aucune dépendance native, aucune clé/API requise.
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'

    // ── IA embarquée : MediaPipe LLM Inference (.task) ────────────────────────
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'

    // ── IA embarquée : ONNX Runtime GenAI (.onnx) ────────────────────────────
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // ── Email IMAP / SMTP ─────────────────────────────────────────────────────
    // JavaMail portage Android — lecture IMAP + envoi SMTP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // ── Localisation ──────────────────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ── Médias / ExoPlayer (optionnel : meilleure gestion audio) ─────────────
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // ── Détection de mot-clé dédiée (écoute permanente basse consommation) ────
    // Picovoice/Porcupine : optionnel, nécessite une clé d'accès (voir ⚙ → Réglages).
    implementation 'ai.picovoice:porcupine-android:4.0.0'
    // openWakeWord : alternative 100% gratuite, sans clé, hors-ligne et basse consommation
    // (modèles ONNX exécutés via onnxruntime-android, déjà présent ci-dessus). C'est le
    // moteur utilisé par défaut dès que Picovoice n'est pas configuré — voir WakeWordService.
    implementation 'xyz.rementia:openwakeword:0.1.5'
}

// ── Modèles openWakeWord : téléchargés au moment du build (pas commités dans git, pour ne
// pas alourdir le dépôt de binaires) depuis les releases officielles GitHub du projet
// open-source openWakeWord (Apache-2.0, https://github.com/dscripka/openWakeWord). Le script
// est idempotent (un fichier déjà présent n'est pas re-téléchargé) et résilient : un échec
// réseau ponctuel n'interrompt pas le build, juste un avertissement (le moteur basse
// consommation restera simplement indisponible tant que les fichiers ne sont pas là).
task downloadWakeWordModels {
    doLast {
        def assetsDir = file("src/main/assets")
        assetsDir.mkdirs()
        def release = "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1"
        def files = [
            "melspectrogram.onnx" : "${release}/melspectrogram.onnx",
            "embedding_model.onnx": "${release}/embedding_model.onnx",
            "hey_jarvis.onnx"     : "${release}/hey_jarvis_v0.1.onnx",
            "alexa.onnx"          : "${release}/alexa_v0.1.onnx",
            "hey_mycroft.onnx"    : "${release}/hey_mycroft_v0.1.onnx"
        ]
        files.each { name, url ->
            def dest = new File(assetsDir, name)
            if (dest.exists() && dest.length() > 0L) return

            def maxAttempts = 3
            def attempt = 1
            def done = false
            while (attempt <= maxAttempts && !done) {
                try {
                    println "📥 Téléchargement du modèle mot-clé (openWakeWord) : ${name} (tentative ${attempt}/${maxAttempts})"
                    new URL(url).openConnection().with { conn ->
                        conn.connectTimeout = 20000
                        conn.readTimeout = 30000
                        conn.instanceFollowRedirects = true
                        dest.withOutputStream { out -> out << conn.inputStream }
                    }
                    done = dest.exists() && dest.length() > 0L
                } catch (Exception e) {
                    println "⚠️ Tentative ${attempt}/${maxAttempts} échouée pour ${name} : ${e.message}"
                    dest.delete()
                    if (attempt < maxAttempts) Thread.sleep(3000)
                }
                attempt++
            }
            if (!done) {
                println "❌ Impossible de télécharger ${name} après ${maxAttempts} tentatives — le moteur d'écoute basse consommation (openWakeWord) ne fonctionnera pas tant que ce fichier n'est pas dans app/src/main/assets/. Relance le build avec une connexion internet active."
            }
        }
    }
}
preBuild.dependsOn downloadWakeWordModels
