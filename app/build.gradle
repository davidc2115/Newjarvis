plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Projet remis à zéro à la demande explicite de l'utilisateur ("recommençons le projet
// complètement") : toutes les fonctionnalités précédentes (IA, appels, SMS, contacts,
// agenda, Obsidian, box internet, IA locale embarquée, wake-word...) ont été retirées.
// Ce module ne garde que le strict nécessaire pour un projet Android minimal qui compile
// et se lance (écran vide) — dépendances/permissions/build natif (NDK, sdcpp) à réajouter
// au fur et à mesure de la reconstruction de chaque fonctionnalité, jamais avant.
android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1-reset"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "jarvispass123"
            keyAlias "jarvisdebugkey"
            keyPassword "jarvispass123"
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug   { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // Écran de chat : liste de messages + sidebar rétractable des conversations.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
