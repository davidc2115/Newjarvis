plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Projet remis à zéro à la demande explicite de l'utilisateur ("recommençons le projet
// complètement") : toutes les fonctionnalités précédentes (IA, appels, SMS, contacts,
// agenda, Obsidian, box internet, IA locale embarquée, wake-word...) ont été retirées.
// Ce module ne garde que le strict nécessaire pour un projet Android minimal qui compile
// et se lance (écran vide) — dépendances/permissions/build natif (NDK, sdcpp) à réajouter
// au fur et à mesure de la reconstruction de chaque fonctionnalité, jamais avant.
android {
    namespace 'com.jarvis.assistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1-reset"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "jarvispass123"
            keyAlias "jarvisdebugkey"
            keyPassword "jarvispass123"
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug   { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }
}

// FIX CI : une dépendance transitive (play-services-auth 21.6.0 ou googleid 1.2.0) tire
// androidx.credentials en 1.6.0-beta01 malgré la version 1.5.0 déclarée explicitement
// ci-dessous (résolution Gradle = plus haute version demandée, directe OU transitive gagne).
// 1.6.x exige AGP 8.6.0 (ce projet est en 8.5.2, voir plus haut) -- on force donc la
// résolution sur 1.5.0 pour toute la config, peu importe qui la redemande en interne.
configurations.all {
    resolutionStrategy {
        force 'androidx.credentials:credentials:1.5.0'
        force 'androidx.credentials:credentials-play-services-auth:1.5.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // Écran de chat : liste de messages + sidebar rétractable des conversations.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Coroutines (lifecycleScope) pour les appels IA asynchrones sans bloquer l'UI.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Backend IA on-device : Gemini Nano via AICore (ML Kit GenAI Prompt API, gratuit, sans
    // clé, aucune donnée envoyée à un serveur). API level 26+ requis (déjà notre minSdk).
    // Uniquement fonctionnel sur les appareils compatibles AICore (voir GeminiNanoController).
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'

    // Backend IA on-device : Gemma 3 1B via LiteRT-LM (API Kotlin officielle et activement
    // maintenue de Google AI Edge -- l'ancienne API MediaPipe "tasks-genai" est en mode
    // maintenance seule depuis 2026 et n'est plus recommandée pour un nouveau projet).
    // Contrairement à Gemini Nano, ne passe PAS par AICore : le modèle (.litertlm, ~555 Mo)
    // est téléchargé séparément depuis Hugging Face et tourne dans le processus de l'appli
    // (voir GemmaController + android:largeHeap ci-dessus). Fonctionne sur tout appareil
    // Android suffisamment puissant, pas seulement les appareils compatibles AICore.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'

    // Connexion Google DIRECTEMENT depuis l'appli (demande explicite de l'utilisateur) : accès
    // complet au compte Google configuré sur le téléphone (mail/agenda), avec possibilité de
    // lier PLUSIEURS comptes Google différents. Deux briques distinctes, toutes deux
    // officiellement recommandées par Google (l'ancienne GoogleSignInClient est dépréciée) :
    //  - Credential Manager = AUTHENTIFICATION (qui est l'utilisateur, sélecteur de compte
    //    natif du système).
    //  - play-services-auth (AuthorizationClient) = AUTORISATION (accès aux données Gmail/
    //    Agenda -- distinct de l'authentification, demande un consentement séparé par scope).
    // Un ID client OAuth (Google Cloud Console, créé par l'utilisateur lui-même -- voir
    // GoogleAccountController) reste indispensable dans les deux cas : c'est une exigence de
    // l'infrastructure OAuth de Google elle-même, pas quelque chose que ce code peut contourner.
    // 1.6.0+ exige AGP 8.6.0 (CI a échoué dessus -- ce projet utilise AGP 8.5.2, voir plus
    // haut) ; 1.5.0 est la dernière version stable compatible avec l'AGP actuel.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
