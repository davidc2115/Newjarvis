name: Build JARVIS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone llama.cpp sources (pour l'IA locale GGUF)
        run: |
          git clone --depth 1 --branch b4753 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Clone stable-diffusion.cpp sources (pour la génération d'image embarquée)
        run: |
          git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp.git sdcpp/src/main/cpp/stable-diffusion.cpp
          cd sdcpp/src/main/cpp/stable-diffusion.cpp
          git submodule update --init ggml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Met en cache le wrapper Gradle téléchargé + les dépendances entre les runs.
      # Sans ça, chaque run repart de zéro et retélécharge gradle-8.x-bin.zip depuis
      # services.gradle.org — un simple aléa réseau côté serveur de distribution
      # (SocketException "Unexpected end of file from server") suffit alors à faire
      # échouer le build avant même la moindre ligne de code compilée. Avec le cache,
      # la plupart des runs n'ont plus du tout besoin de ce téléchargement.
      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Met en cache les modèles ONNX openWakeWord (détection de mot-clé basse
      # consommation, alternative gratuite à Picovoice) : ils sont téléchargés au
      # premier build depuis les releases GitHub officielles du projet openWakeWord
      # (voir la tâche downloadWakeWordModels dans app/build.gradle) et ne changent
      # jamais pour une version de release donnée — la clé est donc statique.
      - name: Cache openWakeWord models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/*.onnx
          key: openwakeword-models-v0.5.1

      - name: Build debug APK
        run: |
          set +e
          attempt=1
          max_attempts=3
          until [ $attempt -gt $max_attempts ]; do
            echo "=== Tentative de build $attempt/$max_attempts ==="
            ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
            code=$?
            cat build.log
            if [ $code -eq 0 ]; then
              exit 0
            fi
            echo "⚠️ Échec (code $code) — probablement un aléa réseau transitoire (ex: téléchargement du wrapper Gradle). Nouvelle tentative dans 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done
          {
            echo "=== kotlinc errors (e:) ==="
            grep -n "^e: " build.log | head -80
            echo "=== what went wrong ==="
            awk '/FAILURE: Build failed/,0' build.log | head -120
          } > summary.log
          echo "----- summary.log -----"
          cat summary.log
          ERR=$(cat summary.log | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error::$ERR"
          echo "❌ Échec après $max_attempts tentatives."
          exit $code

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
