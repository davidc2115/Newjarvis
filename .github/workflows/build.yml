name: Build JARVIS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-android@v3 échoue depuis que le paquet SDK "tools" a été retiré
      # (Warning: Failed to find package 'tools'). On utilise le SDK préinstallé
      # du runner + cmdline-tools, et on accepte les licences manuellement.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true
        continue-on-error: true

      - name: Accept licenses & install platform tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # Paquets minimaux nécessaires au build (sans l'ancien "tools")
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed 2>/dev/null | head -40 || true

      - name: Clone stable-diffusion.cpp sources
        run: |
          git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp.git sdcpp/src/main/cpp/stable-diffusion.cpp
          cd sdcpp/src/main/cpp/stable-diffusion.cpp
          git submodule update --init ggml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache openWakeWord models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/*.onnx
          key: openwakeword-models-v0.5.1

      - name: Build debug APK
        run: |
          set +e
          attempt=1
          max_attempts=3
          until [ $attempt -gt $max_attempts ]; do
            echo "=== Tentative de build $attempt/$max_attempts ==="
            ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
            code=$?
            cat build.log
            if [ $code -eq 0 ]; then
              exit 0
            fi
            echo "⚠️ Échec (code $code). Nouvelle tentative dans 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done
          {
            echo "=== kotlinc errors (e:) ==="
            grep -n "^e: " build.log | head -80
            echo "=== what went wrong ==="
            awk '/FAILURE: Build failed/,0' build.log | head -120
          } > summary.log
          echo "----- summary.log -----"
          cat summary.log
          ERR=$(cat summary.log | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error::$ERR"
          echo "❌ Échec après $max_attempts tentatives."
          exit $code

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
