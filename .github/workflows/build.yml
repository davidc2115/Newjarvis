name: Build JARVIS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Clone llama.cpp sources (pour l'IA locale GGUF)
        run: |
          git clone --depth 1 --branch b4753 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Clone stable-diffusion.cpp sources (pour la génération d'image embarquée)
        run: |
          git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp.git sdcpp/src/main/cpp/stable-diffusion.cpp
          cd sdcpp/src/main/cpp/stable-diffusion.cpp
          git submodule update --init ggml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
