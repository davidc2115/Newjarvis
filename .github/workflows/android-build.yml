name: Build Mobile App Release (Sans Gradle)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mobile-release:
    name: Build Mobile & Web Release Package (Sans Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web & Mobile Production Assets
        run: npm run build

      - name: Package Mobile App Distribution
        run: |
          mkdir -p build-output/NewJarvis-Mobile
          cp -r dist/* build-output/NewJarvis-Mobile/
          cd build-output
          zip -r NewJarvis-Mobile-Package.zip NewJarvis-Mobile/

      - name: Upload Mobile Release Artifact (Sans Gradle)
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Mobile-Release-App
          path: |
            build-output/NewJarvis-Mobile-Package.zip
            dist/
