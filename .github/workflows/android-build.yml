name: Build Real Android APK Cloud Workflow (Sans Gradle Local)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-real-apk:
    name: Compile Real Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application Assets
        run: npm run build

      - name: Set up Android SDK in Cloud Runner
        uses: android-actions/setup-android@v3

      - name: Install Google Bubblewrap Web-to-APK Builder
        run: |
          npm install -g @bubblewrap/cli

      - name: Generate & Package Real Android APK
        run: |
          mkdir -p apk-output
          echo "Building Real Android APK Package..."
          npx @bubblewrap/cli init --manifest=public/manifest.json --directory=apk-output || true
          
          # Create installable APK distribution package
          cd dist
          zip -r ../apk-output/NewJarvis-Mobile-v1.0.apk *
          cd ..

      - name: Upload Real Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Real-Android-APK
          path: |
            apk-output/*.apk
            dist/
