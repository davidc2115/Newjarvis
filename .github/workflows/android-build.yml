name: Build Installable Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Installable Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Line Endings and Permissions for Gradlew
        run: |
          cd android
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true

      - name: Build Android Debug APK with Gradlew
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Installable-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
