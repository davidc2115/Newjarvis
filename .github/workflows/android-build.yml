name: Build Installable Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Generate Gradle Wrapper JAR via system gradle
        run: |
          mkdir -p android/gradle/wrapper
          # Use system gradle to generate wrapper jar
          cd android
          gradle wrapper --gradle-version 8.4 --distribution-type bin 2>/dev/null || true
          # Fallback: download jar directly
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Fix Gradlew Permissions
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: find android -name "*.apk" 2>/dev/null

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
