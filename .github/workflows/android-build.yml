name: Build Android APK Release Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK & Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Release APK via Gradle Cloud CI
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleRelease --no-daemon
          else
            echo "Packaging release distribution..."
            mkdir -p build-output
            cp -r dist/* build-output/
          fi

      - name: Upload APK Artifact for Smartphone Download
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Mobile-Release-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            dist/
            build-output/
