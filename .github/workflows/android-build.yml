name: Build Android APK (Gradle System Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle System Compiler
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Android Debug APK with System Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Installable-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
