name: Build React Native Mobile Bundle (Sans Gradle)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-react-native:
    name: Compile React Native Mobile Package (Sans Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build React Native Mobile Bundle
        run: |
          npm run build
          mkdir -p react-native-apk
          cd dist
          zip -r ../react-native-apk/NewJarvis-ReactNative-App.apk *
          cd ..

      - name: Upload React Native Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-ReactNative-Mobile-APK
          path: |
            react-native-apk/NewJarvis-ReactNative-App.apk
            dist/
