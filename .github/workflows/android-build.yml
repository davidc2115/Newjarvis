name: Build Android APK (Official Android Action)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix Line Endings & Executable Permissions for Gradle
        run: |
          cd android
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true

      - name: Build Android APK with Official Action
        uses: android-actions/build-apk@v2
        with:
          gradle-command: assembleDebug
          project-path: android

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Installable-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
