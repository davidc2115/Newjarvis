name: Build Installable Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle Wrapper JAR (required binary)
        run: |
          mkdir -p android/gradle/wrapper
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar || \
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.4-all.zip" -o /tmp/gradle.zip && \
            unzip -j /tmp/gradle.zip "*/gradle/wrapper/gradle-wrapper.jar" -d android/gradle/wrapper/ 2>/dev/null || true

      - name: Fix gradlew Line Endings and Permissions
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Verify Android Project Structure
        run: |
          echo "=== Project Structure ==="
          find android -name "*.gradle" -o -name "*.java" -o -name "*.xml" | head -30
          echo "=== Gradle Wrapper ==="
          ls -la android/gradle/wrapper/
          echo "=== gradlew content (first 10 lines) ==="
          head -10 android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -50

      - name: List Generated APK Files
        run: |
          find android -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Installable-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
