name: Build Android APK (SubhamTyagi Dedicated Action)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Android APK with Dedicated Action
        uses: subhamtyagi/android-build-action@v1.2.3
        with:
          project-path: android

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Installable-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            apk/*.apk
