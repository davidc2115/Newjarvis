name: Build Native Android APK Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-apk:
    name: Compile Native Android APK File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle CI Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable & Build Debug APK
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon

      - name: Upload Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewJarvis-Native-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/**/*.apk
